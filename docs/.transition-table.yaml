# Status transition whitelist for structured documents (dev-docs skill).
# docs init copies it to the project's docs/.transition-table.yaml.
# To add status enum values for a project, edit this file
# (the status enum of the corresponding schema must be updated as well).
#
# Format: kind: { from_status: [allowed_next_status, ...] }
# An empty array [] is a terminal state (no further transitions).

adr:
  proposed:   [accepted, rejected]
  accepted:   [deprecated, superseded]
  rejected:   []
  deprecated: []
  superseded: []

change:
  draft:     [ready, abandoned]
  ready:     [active, abandoned]
  active:    [closing, abandoned]
  closing:   [active, done, abandoned]
  done:      []
  abandoned: []

task:
  todo:        [in_progress, blocked, cancelled]
  in_progress: [blocked, done, cancelled]
  blocked:     [todo, in_progress, cancelled]
  done:        []
  cancelled:   []

note:
  draft:     [published, archived]
  published: [archived]
  archived:  []

issue:
  open:     [done, rejected]
  done:     []
  rejected: []

design:
  active:     [deprecated, superseded]
  deprecated: []
  superseded: []
